# Builds ddraw.dll and the Inno Setup installer on a clean GitHub runner.
# - Every push to main and every pull request: build + unit tests, setup kept as a workflow artifact.
# - Every tag v*: same build, then a GitHub Release with the setup, its SHA-256 and a build
#   provenance attestation, so anyone can check the published exe came from this commit.
#   Verify a download with: gh attestation verify <setup.exe> --repo FFNNO/RoadRashFFNNOPatch
name: build-and-release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write      # create the release (tags only)
      id-token: write      # sign the provenance attestation
      attestations: write
    env:
      ISCC: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($v -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$') { throw "Tag '$env:GITHUB_REF_NAME' is not vX.Y.Z" }
          } else {
            $v = "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Configure (Win32, Release)
        run: cmake -S renderer -B renderer/build -A Win32

      - name: Build ddraw.dll and tests
        run: cmake --build renderer/build --config Release

      - name: Unit tests
        run: ctest --test-dir renderer/build -C Release --output-on-failure

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path $env:ISCC)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $env:ISCC)) { throw "ISCC.exe not found at $env:ISCC" }

      - name: Build installer
        shell: pwsh
        run: |
          & $env:ISCC /Q "/DAppVersion=${{ steps.version.outputs.value }}" installer\RoadRashFFNNOPatch.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          $setup = Get-Item "installer\Output\RoadRashFFNNOPatch-Setup-${{ steps.version.outputs.value }}.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File -Encoding ascii "installer\Output\SHA256SUMS.txt"
          Get-Content "installer\Output\SHA256SUMS.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RoadRashFFNNOPatch-Setup-${{ steps.version.outputs.value }}
          path: |
            installer/Output/*.exe
            installer/Output/SHA256SUMS.txt
            renderer/build/Release/ddraw.dll
          if-no-files-found: error

      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            installer/Output/RoadRashFFNNOPatch-Setup-${{ steps.version.outputs.value }}.exe
            renderer/build/Release/ddraw.dll

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $setup = "installer\Output\RoadRashFFNNOPatch-Setup-$env:VERSION.exe"
          $sums = "installer\Output\SHA256SUMS.txt"
          $line = (Get-Content $sums).Trim()
          $notes = @"
          Installer for the Road Rash 95 FFNNO Patch $env:VERSION. Run the setup, pick the features you want, and it finds your Steam copy of the game. The HD texture pack is not included.

          Built by GitHub Actions from commit $env:GITHUB_SHA ([build log]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID)).

          **SHA-256**
          ``````
          $line
          ``````

          Verify the download came from this repository's CI:
          ``````
          gh attestation verify RoadRashFFNNOPatch-Setup-$env:VERSION.exe --repo $env:GITHUB_REPOSITORY
          ``````

          Some antivirus tools may flag the proxy ddraw.dll because it patches the game's code in memory. It does not modify any game file.
          "@
          $notes | Out-File -Encoding utf8 notes.md
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $sums --clobber
            gh release edit $tag --notes-file notes.md
          } else {
            gh release create $tag $setup $sums --title "Road Rash 95 FFNNO Patch $env:VERSION" --notes-file notes.md --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed ($LASTEXITCODE)" }
