[General]
; Master enable switch for the Road Rash 95 GPU renderer proxy (0 = pass-through, 1 = active).
Enabled=1
; Log verbosity: debug, info, warn, error.
LogLevel=info

[Presenter]
; Enable Direct3D 11 swapchain presenter (0 = GDI fallback, 1 = D3D11).
Enabled=1
; Upscaling filter: nearest, bilinear, sharp-bilinear.
Filter=bilinear
; Vertical sync (0 = uncapped / immediate, 1 = sync to display refresh).
VSync=0

[World]
; Render the 3D world (road, terrain, buildings, and sprites) on the GPU at 4:3 internal resolution
; instead of the 640x480 software scanline rasterizer (0 = software, 1 = GPU world).
; Can also be toggled at runtime in-race via ToggleKey (default Scroll Lock, which the game ignores).
GpuWorld=0
; Internal 4:3 vertical resolution for GPU world rendering (1080 -> 1440x1080).
InternalHeight=1080
; Toggle key for runtime in-race GpuWorld toggle. Default ScrollLock (VK 0x91): it is outside the
; game window-proc key table (0x10..0x79) and is not Steam's screenshot key (F12).
; Accepts ScrollLock, Pause, F1..F12, or a whole virtual-key code (e.g. 0x91 or 145).
; Invalid values (including trailing characters such as 0x91zz) fall back to ScrollLock.
ToggleKey=ScrollLock
; Draw world quads at the engine's 16.16 corners instead of its whole-pixel snapped vertices, which
; removes the 1-pixel stepping of buildings in motion (1 = sub-pixel, 0 = snapped vertices as in B4).
; Quads whose vertices were rebuilt by the engine (no exact corner match) keep the snapped vertices.
SubPixel=1
; Texture minification: trilinear = upload the engine's own mip levels and blend between them
; (no popping between levels); chosen = level 0 only with point sampling (B4 behaviour).
MipFilter=trilinear
; Anisotropic filtering for MipFilter=trilinear: 2..16 = anisotropic, 0 or 1 = off.
Anisotropy=8
; Widescreen race view: widens the engine's projection width (320 = 4:3) so races fill a wider
; window with a wider horizontal field of view instead of black side bars. Needs GpuWorld=1 and the
; game's high-resolution mode (HiRes on, inset mode off); otherwise the width stays 320.
;   off   = original 4:3 view (default)
;   auto  = width from the window aspect: round(240 * width / height), even, 320..640
;           (1920x1080 -> 426, 21:9 -> 560)
;   <n>   = fixed even width 320..640 (426 = 16:9)
; Decided at each race start, never mid-race. During a widescreen race the software world
; rasterizer is never used, and ToggleKey changes GpuWorld only from the next race. The HUD and
; dashboard stay a centred 4:3 layer. The sky continues across the full width from the game's own
; horizon panorama (if it cannot be read, the horizon edge columns are repeated at the sides).
Widescreen=off

[Capture]
; Enable draw-list capture and F11 single-frame dump to dumps/frame_<N>.json + .png.
Enabled=0
; Automatically dump a specific race frame number (0 = disabled).
AutoDumpFrame=0

[TexturePack]
; Load high-resolution replacement textures from Path (default 1).
; If Path does not exist or has no matching textures, original textures are used.
Enabled=1
; Path to replacement texture pack folder, relative to the game folder.
Path=texture-pack
; Maximum VRAM (MiB) for replacement textures including mip levels.
MaxMiB=512
; Per-frame budget (ms) for turning decoded PNGs into GPU textures on the game thread.
DecodeBudgetMs=4
; Preload the whole pack as soon as the GPU device exists (default 1). PNGs are decoded on a
; background thread, a texture drawn now always goes first, and GPU textures are still created
; within DecodeBudgetMs per frame. Stops at MaxMiB. 0 = load each replacement on its first draw.
Preload=1
; Dump world textures on first sight to DumpPath with manifest.json (0 = off, 1 = on).
; Dumps use the game's full-brightness palette DATA\PALETTE.RAW; dumping is disabled if it is missing.
Dump=0
; Output folder for runtime texture dump, relative to the game folder.
DumpPath=texture-dump

[Save]
; Fixed save file (default 1): "Salvar Juego", "Salvar Juego Como..." and the save before quitting
; write File without a file dialog, and "Cargar Juego" loads File without a dialog when it exists
; (the dialog opens as before when it does not). A short message ("Partida guardada" or
; "Partida cargada") appears on screen after a successful save or load.
; 0 = original dialogs and no message.
Enabled=1
; Save file, relative to the game folder or an absolute path. The default matches the name the
; game suggests, so an existing "Partida 1.RRS" stays loadable.
File=Partida 1.RRS
